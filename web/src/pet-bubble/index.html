<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'">
<title>桌宠时间气泡</title>
<style>
/* MNP_UPSTREAM_STYLE */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;--dshw-base:100vw;pointer-events:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
.mnp-countdown-line{display:flex;justify-content:center;align-items:baseline;max-width:100%;gap:calc(var(--dshw-u) * 10);font-size:calc(var(--dshw-u) * 52);font-weight:650;line-height:1.3}
.mnp-countdown-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mnp-countdown-value{flex-shrink:0;white-space:nowrap}
.dshwv-text .mnp-focus-time{font-size:calc(var(--dshw-u) * 136);font-weight:750;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:calc(var(--dshw-u) * -4);margin:calc(var(--dshw-u) * 14) 0 calc(var(--dshw-u) * 6)}
.mnp-focus-phase{font-size:calc(var(--dshw-u) * 36);font-weight:500;line-height:1.3;opacity:.8}
.mnp-long-time .dshwv-text .mnp-focus-time{font-size:calc(var(--dshw-u) * 100);letter-spacing:calc(var(--dshw-u) * -2)}
@media(prefers-reduced-motion:reduce){.dshwv-pop *{transition-duration:0s!important;transition-delay:0s!important}}
</style></head>
<body><div id="bubble" class="dshwv-pop">
<!-- MNP_UPSTREAM_SVG -->
<div class="dshwv-text"><div id="countdown-line" class="dshwv-trow mnp-countdown-line"><span id="name" class="mnp-countdown-name"></span><span id="value" class="mnp-countdown-value"></span></div><div id="focus-time" class="dshwv-trow mnp-focus-time">25:00</div><div id="focus-phase" class="dshwv-trow mnp-focus-phase">专注 · 未开始</div></div>
</div><script>/* MNP_BUBBLE_APP */</script></body></html>
